############################
## HUGO MODULES
## Install or uninstall themes and plugins here.
## Docs: https://gohugo.io/hugo-modules/
############################

imports:
  - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-plugin-netlify
  - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind

# Install any Hugo Blox within the `hugo-blox/blox/` folder
mounts:
  - source: hugo-blox/blox/community
    target: layouts/_partials/blox/community/
    includeFiles: '**.html'
  - source: hugo-blox/blox/all-access
    target: layouts/_partials/blox/
    includeFiles: '**.html'
  - source: hugo-blox/blox
    target: assets/dist/community/blox/
    includeFiles: '**.css'
  - source: layouts
    target: layouts
  - source: assets
    target: assets
  - source: static
    target: static
  # The bundle's tools/3d-ice/index.html is 3d-ice.com's redirect stub; here
  # that URL belongs to the Hugo landing page in content/tools/3d-ice/. home/
  # holds 3d-ice.com's home pages, which scripts/sync_3d_ice_bundle.mjs turns
  # into that landing page; they are sources, not pages to publish.
  - source: generated/3d-ice-compat
    target: static
    excludeFiles:
      - tools/3d-ice/index.html
      - home/**
