<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SLIDE 3D Surface Showcase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #plot {
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="plot"></div>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script>
(function () {
  // --- Physics (matches SLIDE.html) ---
  const C = 0.50, As = 2400, n = 3.0;

  function calculateTauB(C, As, n, N, u) {
    if (u <= 0) return 0;
    const denominator = Math.pow(C, n) * Math.pow(N, n) * As + u;
    if (!Number.isFinite(denominator) || denominator <= 0) return 0;
    return C * N * Math.pow(u / denominator, 1 / n);
  }

  // --- Grid sampling (matches SLIDE.html) ---
  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function buildVelocitySamples(maxU) {
    const safeMax = Math.max(3000, maxU);
    const samples = new Set([0, safeMax]);
    const lowBand = Math.min(safeMax * 0.22, 1200);
    const linearCount = 28;
    const logCount = 40;
    for (let i = 0; i <= linearCount; i++) {
      samples.add((lowBand * i) / linearCount);
    }
    const start = Math.max(1, lowBand || safeMax / 40);
    const ratio = safeMax / start;
    for (let i = 0; i <= logCount; i++) {
      const t = i / logCount;
      samples.add(start * Math.pow(Math.max(1, ratio), t));
    }
    return Array.from(samples)
      .map(function (v) { return clamp(v, 0, safeMax); })
      .sort(function (a, b) { return a - b; });
  }

  function buildPressureSamples() {
    const samples = [0.01, 0.02, 0.05];
    for (let p = 0.1; p <= 4.0001; p += 0.15) {
      samples.push(Number(p.toFixed(2)));
    }
    if (samples[samples.length - 1] !== 4) samples.push(4);
    return samples;
  }

  // --- Build surface data ---
  const displayMax = 3000;
  const xValues = buildVelocitySamples(displayMax);
  const yValues = buildPressureSamples();
  const zValues = yValues.map(function (pressure) {
    return xValues.map(function (velocity) {
      return calculateTauB(C, As, n, pressure, velocity);
    });
  });

  const zMax = Math.max.apply(null, zValues.map(function (row) {
    return Math.max.apply(null, row);
  })) * 1.05;

  // --- Plotly surface trace (matches SLIDE.html styling) ---
  const surface = {
    x: xValues,
    y: yValues,
    z: zValues,
    type: "surface",
    showscale: false,
    hoverinfo: "skip",
    opacity: 0.92,
    colorscale: [
      [0,    "rgba(224,245,255,0.92)"],
      [0.15, "rgba(163,218,244,0.94)"],
      [0.35, "rgba(80,185,220,0.95)"],
      [0.55, "rgba(22,148,194,0.96)"],
      [0.75, "rgba(16,108,158,0.97)"],
      [1,    "rgba(8,60,99,0.98)"]
    ],
    contours: {
      z: {
        show: true,
        highlight: false,
        usecolormap: false,
        project: { z: false },
        color: "rgba(255,255,255,0.12)",
        width: 1
      }
    },
    lighting: {
      ambient: 0.88,
      diffuse: 0.58,
      roughness: 0.42,
      specular: 0.45,
      fresnel: 0.35
    },
    lightposition: { x: 800, y: 1200, z: 1400 }
  };

  // --- Scene layout: no axis titles, no tick labels ---
  const sceneGridColor = "rgba(160,200,220,0.22)";
  const sceneAxisColor = "rgba(170,210,230,0.50)";

  const axisCommon = {
    title: "",
    showticklabels: false,
    gridcolor: sceneGridColor,
    gridwidth: 1,
    zeroline: false,
    showspikes: false,
    showline: true,
    linecolor: sceneAxisColor,
    linewidth: 1.5,
    showbackground: true,
    backgroundcolor: "rgba(0,0,0,0)"
  };

  // --- Initial camera (matches SLIDE.html DEFAULT_CAMERA) ---
  const R_EYE = Math.sqrt(1.7 * 1.7 + 1.16 * 1.16); // orbital radius in xz
  const EYE_Y = 1.48;
  let theta = Math.atan2(1.16, 1.7); // initial angle

  function cameraAt(angle) {
    return {
      eye: { x: R_EYE * Math.cos(angle), y: EYE_Y, z: R_EYE * Math.sin(angle) },
      center: { x: 0.04, y: 0.02, z: -0.04 },
      up: { x: 0, y: 0, z: 1 }
    };
  }

  const layout = {
    margin: { l: 0, r: 0, t: 0, b: 0 },
    scene: {
      camera: cameraAt(theta),
      aspectratio: { x: 1.6, y: 0.85, z: 0.82 },
      xaxis: Object.assign({}, axisCommon, { range: [0, displayMax] }),
      yaxis: Object.assign({}, axisCommon, { range: [0.01, 4] }),
      zaxis: Object.assign({}, axisCommon, { range: [0, zMax] }),
      bgcolor: "rgba(0,0,0,0)"
    },
    paper_bgcolor: "rgba(0,0,0,0)",
    showlegend: false,
    font: { family: "sans-serif", color: "#c8e8f5" }
  };

  const config = {
    responsive: true,
    displayModeBar: false,
    scrollZoom: false
  };

  const div = document.getElementById("plot");

  Plotly.newPlot(div, [surface], layout, config).then(function () {
    // --- Slow auto-rotation via requestAnimationFrame ---
    var autoRotate = true;

    // Respect prefers-reduced-motion
    var motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    function applyMotionPref() { autoRotate = !motionQuery.matches; }
    applyMotionPref();
    motionQuery.addEventListener("change", applyMotionPref);

    // Rotation speed: ~0.35 rad/min ≈ 0.00583 rad/s
    var SPEED = 0.35 / 60; // rad per second
    var lastTime = null;

    function animate(timestamp) {
      requestAnimationFrame(animate);
      if (!autoRotate) { lastTime = null; return; }
      if (lastTime === null) { lastTime = timestamp; return; }

      var dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      // Cap dt to avoid large jumps on tab switch
      if (dt > 0.5) dt = 0.016;

      theta += SPEED * dt;

      Plotly.relayout(div, { "scene.camera": cameraAt(theta) });
    }

    requestAnimationFrame(animate);
  });
})();
</script>
</body>
</html>
