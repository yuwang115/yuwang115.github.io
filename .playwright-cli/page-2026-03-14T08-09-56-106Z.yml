        - generic [ref=e82]:
          - heading "Abstract" [level=2] [ref=e83]
          - generic [ref=e84]:
            - text: Antarctica’s contribution to sea level rise depends critically on basal sliding—the friction between ice and bedrock—yet the physical processes governing this resistance remain poorly constrained. Building on the Greenland Ice Sheet Ensemble Friction Inversion (GrISEFI), we present the Antarctic Ice Sheet Ensemble Friction Inversion (AISEFI), quantifying basal shear stress and its uncertainty across Antarctica using 60 ensemble members that sample uncertainties in ice rheology, basal properties, and observations.
            - text: "Antarctic basal shear stress patterns require two distinct regimes controlled by effective pressure (the difference between ice overburden and subglacial water pressure) and basal velocity: a velocity-dependent Weertman regime and an effective pressure-limited Coulomb regime. Comparison with subglacial hydrology model output confirms that effective pressure variations control spatial patterns in Coulomb regime areas, although simplified parameterizations based on ice geometry can capture first-order patterns for most regions."
            - text: Statistical analysis reveals that basal sliding exhibits weaker velocity dependence than commonly assumed in ice sheet models, with potential velocity-weakening behavior in the Coulomb regime, where basal shear stress decreases as velocity increases. Remarkably, these behaviors are consistent with those of Greenland despite vastly different characteristics, suggesting that the same two-regime physics reflects fundamental ice-bed processes rather than region-specific conditions.
            - text: We synthesize the findings of both ice sheets to provide unified recommendations for basal sliding treatment in ice sheet models. The AISEFI and GrISEFI datasets together provide a framework for connecting model parameters to observable bed properties, advancing integration of glacial geology and ice sheet modeling for improved sea level projections.
