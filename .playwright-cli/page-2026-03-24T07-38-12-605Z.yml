          - article [ref=e112]:
            - heading "Fully Interactive 3D Experience" [level=3] [ref=e113]
            - paragraph [ref=e114]: Freely rotate, zoom, and change your viewpoint. Explore the ice sheets as if you were examining a physical model right in your hands.
          - article [ref=e115]:
            - heading "Comprehensive & Customisable Data" [level=3] [ref=e116]
            - paragraph [ref=e117]: Available for both Antarctica and Greenland. Seamlessly visualise continental-scale land data alongside simulated ocean circulations. Layer and combine them in any way you desire to uncover new insights.
          - article [ref=e118]:
            - heading "Direct Gateway to Source Data" [level=3] [ref=e119]
            - paragraph [ref=e120]: Built as a systematic data platform for professional researchers. First, visualise the latest state-of-the-art datasets in 3D, then simply click to jump directly to the source data you need.
          - article [ref=e121]:
            - heading "Optimised Cross-Platform Performance" [level=3] [ref=e122]
            - paragraph [ref=e123]: Features a balanced resolution preset for smooth exploration on mobile touchscreens. For the ultimate experience, switch to the stunning HD Option (4km resolution for Antarctica, 1km for Greenland), highly recommended for large desktop screens.
