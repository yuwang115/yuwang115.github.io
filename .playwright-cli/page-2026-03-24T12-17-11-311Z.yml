        - generic [ref=e79]:
          - heading "About Me" [level=2] [ref=e80]
          - paragraph [ref=e81]: Yu Wang (王禹) is a fourth-year PhD candidate in glaciology at the Institute for Marine and Antarctic Studies, University of Tasmania, and a member of the Australian Antarctic Program Partnership. My research uses numerical models to investigate Antarctic ice dynamics, subglacial hydrology, and ice–ocean interactions, with the goal of improving projections of future sea-level rise.
          - paragraph [ref=e82]: Originally from China, I now call Tasmania—Australia’s heart-shaped southern island—home while I study the frozen south. During weekdays, I model ice sheets on supercomputers; on weekends, you’ll often find me outdoors on hiking trails, climbing routes, badminton courts, or by the shoreline with a camera (or a fishing rod).
