  <!-- Shuttlecock cork -->
  <circle cx="19" cy="6" r="1"/>
  <!-- Shuttlecock feathers -->
  <path d="M18.2 6.8L15.6 8M18.8 6.4L16 6M18.2 5.2L16 4.2"/>
